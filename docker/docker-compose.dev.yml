version: '3.8'

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - visionseanet-dev

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:devpassword@db:5432/visionseadb_dev
      - REDIS_URL=redis://redis:6379
      - DEBUG=True
      - RELOAD=True
    volumes:
      - ../backend:/app
    depends_on:
      - db
      - redis
    networks:
      - visionseanet-dev

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=visionseadb_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=devpassword
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - visionseanet-dev

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - visionseanet-dev

volumes:
  postgres_dev_data:

networks:
  visionseanet-dev:
    driver: bridge